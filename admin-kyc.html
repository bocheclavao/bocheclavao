<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin KYC - Boche Clava'o</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background: #000000; 
            min-height: 100vh; 
            color: #ffffff; 
            padding: 20px;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 215, 0, 0.03) 0%, transparent 25%);
        }
        
        .back-link { 
            display: inline-flex; 
            align-items: center; 
            gap: 8px;
            margin-bottom: 20px; 
            color: #FFD700; 
            text-decoration: none; 
            padding: 10px 20px; 
            border: 1px solid #FFD700; 
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .back-link:hover { background: #FFD700; color: #000; transform: translateX(-5px); }
        
        .module-header { 
            text-align: center; 
            margin-bottom: 30px; 
            padding: 25px; 
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%); 
            border-radius: 12px; 
            border: 1px solid #FFD700;
            max-width: 1400px;
            margin: 0 auto 30px;
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.1);
        }
        .module-header h1 { 
            color: #FFD700; 
            font-size: 1.8rem; 
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .module-header p { color: #999; font-size: 0.95rem; }
        
        /* ========== BARRA DE BÚSQUEDA Y FILTROS ========== */
        .search-filter-bar {
            max-width: 1200px;
            margin: 0 auto 25px;
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 20px;
        }
        
        .search-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        
        .search-select,
        .search-input {
            padding: 12px 16px;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s;
        }
        .search-input:focus, .search-select:focus {
            outline: none;
            border-color: #FFD700;
        }
        .search-select { min-width: 180px; }
        .search-input { flex: 1; min-width: 200px; }
        
        .filter-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid #222;
        }
        
        .filter-label {
            color: #FFD700;
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .date-input {
            padding: 10px 14px;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
        }
        .date-input:focus { outline: none; border-color: #FFD700; }
        
        .btn { 
            padding: 10px 18px; 
            border: none; 
            border-radius: 8px; 
            font-weight: 700; 
            cursor: pointer; 
            font-family: 'Montserrat', sans-serif; 
            transition: all 0.3s; 
            display: inline-flex; 
            align-items: center; 
            gap: 8px;
            font-size: 0.85rem;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-search { background: #FFD700; color: #000; }
        .btn-search:hover { background: #FFC700; }
        .btn-clear { background: #333; color: #fff; }
        .btn-clear:hover { background: #444; }
        .btn-approve { background: #00ff00; color: #000; padding: 12px 25px; font-size: 0.9rem; }
        .btn-approve:hover { background: #00cc00; }
        .btn-reject { background: #ff4444; color: #fff; padding: 12px 25px; font-size: 0.9rem; }
        .btn-reject:hover { background: #cc0000; }
        
        /* ========== ESTADÍSTICAS ========== */
        .stats-bar { 
            display: flex; 
            gap: 15px; 
            justify-content: center; 
            margin-bottom: 25px; 
            flex-wrap: wrap;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }
        .stat-box { 
            background: #0a0a0a; 
            border: 1px solid #222; 
            padding: 15px; 
            border-radius: 8px; 
            text-align: center; 
            min-width: 130px; 
            flex: 1; 
            max-width: 180px;
            transition: all 0.3s;
        }
        .stat-box:hover { border-color: #FFD700; transform: translateY(-3px); }
        .stat-box .number { font-size: 1.8rem; font-weight: 800; color: #FFD700; }
        .stat-box .label { color: #999; font-size: 0.8rem; margin-top: 5px; }
        
        /* ========== INFO DE RESULTADOS ========== */
        .results-info {
            max-width: 1200px;
            margin: 0 auto 15px;
            padding: 12px 20px;
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid #FFD700;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .results-info-text {
            color: #FFD700;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        /* ========== CARDS KYC COLAPSABLES ========== */
        .kyc-card { 
            background: #0a0a0a; 
            border: 1px solid #222; 
            border-radius: 12px; 
            margin-bottom: 12px; 
            max-width: 1200px; 
            margin-left: auto; 
            margin-right: auto;
            transition: all 0.3s;
            overflow: hidden;
        }
        .kyc-card:hover { border-color: #FFD700; box-shadow: 0 5px 20px rgba(255, 215, 0, 0.1); }
        
        .kyc-card-header {
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.3s;
            gap: 15px;
            flex-wrap: wrap;
        }
        .kyc-card-header:hover { background: rgba(255, 215, 0, 0.03); }
        
        .kyc-card-main-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
            min-width: 0;
            flex-wrap: wrap;
        }
        
        .kyc-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #000;
            font-size: 1.3rem;
            flex-shrink: 0;
        }
        
        .kyc-user-info {
            flex: 1;
            min-width: 0;
        }
        
        .kyc-user-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .kyc-user-meta {
            display: flex;
            gap: 12px;
            font-size: 0.8rem;
            color: #999;
            flex-wrap: wrap;
        }
        .kyc-user-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .kyc-user-meta i { color: #FFD700; }
        
        .kyc-card-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        
        .status-badge { 
            padding: 5px 12px; 
            border-radius: 20px; 
            font-size: 0.75rem; 
            font-weight: 700; 
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-pending { background: rgba(255, 165, 0, 0.2); color: #FFA500; border: 1px solid #FFA500; }
        .status-verified { background: rgba(0, 255, 0, 0.2); color: #00ff00; border: 1px solid #00ff00; }
        .status-rejected { background: rgba(255, 0, 0, 0.2); color: #ff4444; border: 1px solid #ff4444; }
        
        .expand-icon {
            color: #FFD700;
            transition: transform 0.3s;
            font-size: 1rem;
        }
        .kyc-card.expanded .expand-icon {
            transform: rotate(180deg);
        }
        
        /* ========== CONTENIDO EXPANDIBLE ========== */
        .kyc-card-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-in-out;
        }
        .kyc-card.expanded .kyc-card-content {
            max-height: 2000px;
        }
        
        .kyc-content-inner {
            padding: 0 20px 20px;
            border-top: 1px solid #222;
        }
        
        .section-title {
            color: #FFD700;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 20px 0 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #222;
        }
        
        .info-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 12px; 
        }
        .info-item label { 
            display: block; 
            color: #666; 
            font-size: 0.75rem; 
            margin-bottom: 4px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .info-item span { color: #fff; font-weight: 600; font-size: 0.9rem; word-break: break-all; }
        
        .images-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 15px; 
        }
        .image-box { text-align: center; }
        .image-box img { 
            width: 100%; 
            border-radius: 8px; 
            border: 2px solid #333; 
            margin-bottom: 8px; 
            height: 180px; 
            object-fit: cover; 
            cursor: pointer;
            transition: all 0.3s;
        }
        .image-box img:hover { border-color: #FFD700; transform: scale(1.03); }
        .image-box p { font-size: 0.8rem; color: #999; font-weight: 600; }
        
        .kyc-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #222;
        }
        
        /* ========== PAGINACIÓN ========== */
        .pagination { 
            display: flex; 
            gap: 8px; 
            justify-content: center; 
            margin-top: 30px; 
            flex-wrap: wrap;
            align-items: center;
            padding: 20px;
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 12px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        .page-btn { 
            padding: 10px 14px; 
            background: #111; 
            border: 1px solid #333; 
            border-radius: 6px; 
            color: #fff; 
            cursor: pointer; 
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
            min-width: 40px;
        }
        .page-btn:hover:not(:disabled) { border-color: #FFD700; color: #FFD700; }
        .page-btn.active { background: #FFD700; color: #000; border-color: #FFD700; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .page-info {
            color: #999;
            font-size: 0.85rem;
            margin: 0 10px;
        }
        
        /* ========== ESTADOS VACÍOS ========== */
        .loading { text-align: center; color: #FFD700; margin: 50px 0; font-size: 1.2rem; }
        .empty { 
            text-align: center; 
            color: #666; 
            padding: 60px 40px;
            font-size: 1rem;
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 12px;
            max-width: 600px;
            margin: 30px auto;
        }
        .empty i { font-size: 3rem; margin-bottom: 15px; display: block; }
        
        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .module-header h1 { font-size: 1.3rem; flex-direction: column; }
            .stat-box { min-width: 100px; padding: 10px; }
            .stat-box .number { font-size: 1.4rem; }
            .kyc-card-header { padding: 12px 15px; }
            .kyc-avatar { width: 40px; height: 40px; font-size: 1rem; }
            .kyc-user-name { font-size: 0.95rem; }
            .kyc-user-meta { font-size: 0.7rem; }
            .kyc-content-inner { padding: 0 15px 15px; }
            .search-filter-bar { padding: 15px; }
            .filter-row { flex-direction: column; align-items: stretch; }
            .date-input { width: 100%; }
        }
    </style>
</head>
<body>
    <a href="admin.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Volver al Panel
    </a>

    <div class="module-header">
        <h1><i class="fas fa-id-card"></i> Verificaciones KYC</h1>
        <p>Revisa y aprueba documentos de identidad de los usuarios</p>
    </div>

    <!-- ========== BARRA DE BÚSQUEDA Y FILTROS ========== -->
    <div class="search-filter-bar">
        <div class="search-row">
            <select id="searchType" class="search-select">
                <option value="user_id">🔍 Buscar por ID (BC-xxxx)</option>
                <option value="numero_documento">🆔 Buscar por Cédula</option>
                <option value="nombre">👤 Buscar por Nombre</option>
                <option value="email">📧 Buscar por Email</option>
            </select>
            <input type="text" id="searchInput" class="search-input" placeholder="Escribe el ID, cédula, nombre o email...">
            <button class="btn btn-search" onclick="aplicarBusqueda()">
                <i class="fas fa-search"></i> Buscar
            </button>
            <button class="btn btn-clear" onclick="limpiarBusqueda()">
                <i class="fas fa-times"></i> Limpiar
            </button>
        </div>
        
        <div class="filter-row">
            <span class="filter-label"><i class="fas fa-calendar-alt"></i> Filtrar por fecha:</span>
            <input type="date" id="fechaDesde" class="date-input" title="Fecha desde">
            <span style="color: #666;">→</span>
            <input type="date" id="fechaHasta" class="date-input" title="Fecha hasta">
            <button class="btn btn-search" onclick="aplicarBusqueda()">
                <i class="fas fa-filter"></i> Aplicar
            </button>
        </div>
    </div>

    <!-- ========== ESTADÍSTICAS ========== -->
    <div id="statsBar" class="stats-bar"></div>
    
    <!-- ========== INFO DE RESULTADOS ========== -->
    <div id="resultsInfo" class="results-info" style="display: none;">
        <span class="results-info-text" id="resultsInfoText"></span>
    </div>
    
    <!-- ========== LOADING ========== -->
    <div id="loadingKyc" class="loading">
        <i class="fas fa-circle-notch fa-spin"></i> Cargando solicitudes KYC...
    </div>
    
    <!-- ========== CONTENEDOR DE CARDS ========== -->
    <div id="containerKyc"></div>
    
    <!-- ========== PAGINACIÓN ========== -->
    <div id="pagination" class="pagination" style="display: none;"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', async function() {
        const db = window.supabaseClient;
        if (!db) { 
            console.error('No se pudo obtener el cliente de Supabase'); 
            return; 
        }

        const containerKyc = document.getElementById('containerKyc');
        const loadingKyc = document.getElementById('loadingKyc');
        const statsBar = document.getElementById('statsBar');
        const pagination = document.getElementById('pagination');
        const resultsInfo = document.getElementById('resultsInfo');
        const resultsInfoText = document.getElementById('resultsInfoText');

        // Estado global
        let currentPage = 1;
        const itemsPerPage = 20;
        let totalCount = 0;
        let currentSearch = { type: 'user_id', value: '' };
        let currentDates = { desde: null, hasta: null };

        // ========== ESTADÍSTICAS ==========
        async function cargarEstadisticas() {
            try {
                const [pendientes, verificados, rechazados, sinKyc, bloqueados] = await Promise.all([
                    db.from('perfiles').select('id', { count: 'exact', head: true }).eq('estado_kyc', 'pendiente'),
                    db.from('perfiles').select('id', { count: 'exact', head: true }).eq('estado_kyc', 'verificado'),
                    db.from('perfiles').select('id', { count: 'exact', head: true }).eq('estado_kyc', 'rechazado'),
                    db.from('perfiles').select('id', { count: 'exact', head: true }).is('estado_kyc', null),
                    db.from('perfiles').select('id', { count: 'exact', head: true }).eq('bloqueado', true)
                ]);
                
                statsBar.innerHTML = `
                    <div class="stat-box">
                        <div class="number" style="color: #FFA500;">${pendientes.count || 0}</div>
                        <div class="label">Pendientes</div>
                    </div>
                    <div class="stat-box">
                        <div class="number" style="color: #00ff00;">${verificados.count || 0}</div>
                        <div class="label">Verificados</div>
                    </div>
                    <div class="stat-box">
                        <div class="number" style="color: #ff4444;">${rechazados.count || 0}</div>
                        <div class="label">Rechazados</div>
                    </div>
                    <div class="stat-box">
                        <div class="number" style="color: #999;">${sinKyc.count || 0}</div>
                        <div class="label">Sin KYC</div>
                    </div>
                    <div class="stat-box">
                        <div class="number" style="color: #666;">${bloqueados.count || 0}</div>
                        <div class="label">Bloqueados</div>
                    </div>
                `;
            } catch (err) { 
                console.error('Error cargando estadísticas:', err); 
            }
        }

        // ========== CARGAR KYC CON PAGINACIÓN Y FILTROS ==========
        async function cargarSolicitudesKYC() {
            loadingKyc.style.display = 'block';
            containerKyc.innerHTML = '';
            pagination.style.display = 'none';
            resultsInfo.style.display = 'none';
            
            try {
                let query = db.from('perfiles').select('*', { count: 'exact' }).eq('estado_kyc', 'pendiente');
                
                // Aplicar búsqueda por texto
                if (currentSearch.value.trim()) {
                    const val = `%${currentSearch.value.trim()}%`;
                    if (currentSearch.type === 'user_id') query = query.ilike('user_id', val);
                    else if (currentSearch.type === 'numero_documento') query = query.ilike('numero_documento', val);
                    else if (currentSearch.type === 'nombre') query = query.ilike('nombre', val);
                    else if (currentSearch.type === 'email') query = query.ilike('email', val);
                }
                
                // Aplicar filtro de fechas
                if (currentDates.desde) {
                    query = query.gte('ultima_actualizacion', currentDates.desde + 'T00:00:00');
                }
                if (currentDates.hasta) {
                    query = query.lte('ultima_actualizacion', currentDates.hasta + 'T23:59:59');
                }
                
                // Paginación
                const from = (currentPage - 1) * itemsPerPage;
                const to = from + itemsPerPage - 1;
                
                const { data: perfiles, count, error } = await query
                    .order('ultima_actualizacion', { ascending: false })
                    .range(from, to);
                
                loadingKyc.style.display = 'none';
                
                if (error) { 
                    containerKyc.innerHTML = `<div class="empty"><i class="fas fa-exclamation-triangle" style="color: #ff4444;"></i>Error: ${error.message}</div>`; 
                    return; 
                }
                
                totalCount = count || 0;
                
                // Mostrar info de resultados
                const totalPages = Math.ceil(totalCount / itemsPerPage);
                if (totalCount > 0) {
                    resultsInfo.style.display = 'flex';
                    resultsInfoText.innerHTML = `
                        <i class="fas fa-list"></i> 
                        Mostrando <strong>${from + 1}-${Math.min(to, totalCount)}</strong> de <strong>${totalCount}</strong> solicitudes 
                        (Página ${currentPage} de ${totalPages})
                    `;
                }
                
                if (!perfiles || perfiles.length === 0) { 
                    containerKyc.innerHTML = `
                        <div class="empty">
                            <i class="fas fa-check-circle" style="color: #00ff00;"></i>
                            ¡No hay solicitudes pendientes con los filtros aplicados!
                        </div>
                    `; 
                    return; 
                }
                
                perfiles.forEach(perfil => { 
                    containerKyc.appendChild(crearCardKYC(perfil)); 
                });
                
                if (totalPages > 1) {
                    renderPagination(totalPages);
                    pagination.style.display = 'flex';
                }
                
            } catch (err) { 
                console.error('Error:', err); 
                loadingKyc.style.display = 'none'; 
                containerKyc.innerHTML = `<div class="empty"><i class="fas fa-exclamation-triangle" style="color: #ff4444;"></i>Error al cargar: ${err.message}</div>`;
            }
        }

        // ========== CREAR CARD KYC COLAPSABLE ==========
        function crearCardKYC(perfil) {
            const card = document.createElement('div');
            card.className = 'kyc-card';
            card.id = `kyc-card-${perfil.id}`;
            
            const inicial = (perfil.nombre || 'U').charAt(0).toUpperCase();
            const fechaEnvio = perfil.ultima_actualizacion 
                ? new Date(perfil.ultima_actualizacion).toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })
                : '---';
            
            card.innerHTML = `
                <!-- HEADER (siempre visible) -->
                <div class="kyc-card-header" onclick="toggleCard('${perfil.id}')">
                    <div class="kyc-card-main-info">
                        <div class="kyc-avatar">${inicial}</div>
                        <div class="kyc-user-info">
                            <div class="kyc-user-name">${perfil.nombre || 'Sin nombre'}</div>
                            <div class="kyc-user-meta">
                                <span><i class="fas fa-id-badge"></i> ${perfil.user_id || '---'}</span>
                                <span><i class="fas fa-envelope"></i> ${perfil.email || '---'}</span>
                                <span><i class="fas fa-clock"></i> ${fechaEnvio}</span>
                            </div>
                        </div>
                    </div>
                    <div class="kyc-card-right">
                        <span class="status-badge status-pending">Pendiente</span>
                        <i class="fas fa-chevron-down expand-icon"></i>
                    </div>
                </div>
                
                <!-- CONTENIDO EXPANDIBLE -->
                <div class="kyc-card-content">
                    <div class="kyc-content-inner">
                        <div class="section-title"><i class="fas fa-user"></i> Información Personal</div>
                        <div class="info-grid">
                            <div class="info-item"><label>Nacionalidad</label><span>${perfil.nacionalidad || '---'}</span></div>
                            <div class="info-item"><label>País</label><span>${perfil.pais || '---'}</span></div>
                            <div class="info-item"><label>Ciudad</label><span>${perfil.ciudad || '---'}</span></div>
                            <div class="info-item"><label>Teléfono</label><span>${perfil.telefono || '---'}</span></div>
                            <div class="info-item"><label>Fecha Nac.</label><span>${perfil.fecha_nacimiento || '---'}</span></div>
                            <div class="info-item"><label>Email</label><span>${perfil.email || '---'}</span></div>
                        </div>
                        
                        <div class="section-title"><i class="fas fa-address-card"></i> Documento</div>
                        <div class="info-grid">
                            <div class="info-item"><label>Tipo</label><span>${perfil.tipo_documento || '---'}</span></div>
                            <div class="info-item"><label>Número</label><span style="color: #FFD700; font-size: 1rem;">${perfil.numero_documento || '---'}</span></div>
                            <div class="info-item"><label>Dirección</label><span>${perfil.direccion || '---'}</span></div>
                        </div>
                        
                        <div class="section-title"><i class="fas fa-images"></i> Documentos Enviados</div>
                        <div class="images-grid">
                            <div class="image-box">
                                <img src="${perfil.documento_frontal_url || 'https://via.placeholder.com/300x200/111/666?text=Sin+Foto'}" onclick="event.stopPropagation(); window.open(this.src, '_blank')">
                                <p><i class="fas fa-id-card"></i> Documento (Frente)</p>
                            </div>
                            <div class="image-box">
                                <img src="${perfil.documento_trasero_url || 'https://via.placeholder.com/300x200/111/666?text=Sin+Foto'}" onclick="event.stopPropagation(); window.open(this.src, '_blank')">
                                <p><i class="fas fa-id-card"></i> Documento (Reverso)</p>
                            </div>
                            <div class="image-box">
                                <img src="${perfil.selfie_url || 'https://via.placeholder.com/300x200/111/666?text=Sin+Foto'}" onclick="event.stopPropagation(); window.open(this.src, '_blank')">
                                <p><i class="fas fa-user-circle"></i> Selfie</p>
                            </div>
                        </div>
                        
                        <div class="kyc-actions">
                            <button class="btn btn-approve" onclick="event.stopPropagation(); procesarKYC('${perfil.id}', 'verificado')">
                                <i class="fas fa-check-circle"></i> Aprobar KYC
                            </button>
                            <button class="btn btn-reject" onclick="event.stopPropagation(); procesarKYC('${perfil.id}', 'rechazado')">
                                <i class="fas fa-times-circle"></i> Rechazar KYC
                            </button>
                        </div>
                    </div>
                </div>
            `;
            return card;
        }

        // ========== TOGGLE EXPANDIR/COLAPSAR ==========
        window.toggleCard = function(id) {
            const card = document.getElementById(`kyc-card-${id}`);
            if (card) {
                card.classList.toggle('expanded');
            }
        };

        // ========== PAGINACIÓN ==========
        function renderPagination(totalPages) {
            let html = '';
            
            // Botón anterior
            html += `<button class="page-btn" onclick="irAPagina(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                <i class="fas fa-chevron-left"></i>
            </button>`;
            
            // Páginas
            const maxVisible = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let endPage = Math.min(totalPages, startPage + maxVisible - 1);
            
            if (endPage - startPage < maxVisible - 1) {
                startPage = Math.max(1, endPage - maxVisible + 1);
            }
            
            if (startPage > 1) {
                html += `<button class="page-btn" onclick="irAPagina(1)">1</button>`;
                if (startPage > 2) html += `<span class="page-info">...</span>`;
            }
            
            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="irAPagina(${i})">${i}</button>`;
            }
            
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += `<span class="page-info">...</span>`;
                html += `<button class="page-btn" onclick="irAPagina(${totalPages})">${totalPages}</button>`;
            }
            
            // Botón siguiente
            html += `<button class="page-btn" onclick="irAPagina(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                <i class="fas fa-chevron-right"></i>
            </button>`;
            
            pagination.innerHTML = html;
        }

        window.irAPagina = function(page) {
            currentPage = page;
            cargarSolicitudesKYC();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // ========== BÚSQUEDA Y FILTROS ==========
        window.aplicarBusqueda = function() {
            currentSearch.type = document.getElementById('searchType').value;
            currentSearch.value = document.getElementById('searchInput').value.trim();
            currentDates.desde = document.getElementById('fechaDesde').value || null;
            currentDates.hasta = document.getElementById('fechaHasta').value || null;
            currentPage = 1;
            cargarSolicitudesKYC();
        };

        window.limpiarBusqueda = function() {
            document.getElementById('searchInput').value = '';
            document.getElementById('fechaDesde').value = '';
            document.getElementById('fechaHasta').value = '';
            currentSearch = { type: 'user_id', value: '' };
            currentDates = { desde: null, hasta: null };
            currentPage = 1;
            cargarSolicitudesKYC();
        };

        // Enter en búsqueda
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') aplicarBusqueda();
        });

        // ========== PROCESAR KYC ==========
        window.procesarKYC = async function(userId, nuevoEstado) {
            const confirmMsg = nuevoEstado === 'verificado' 
                ? '✅ ¿Aprobar este KYC? El usuario podrá acceder a todas las funciones.' 
                : '❌ ¿Rechazar este KYC? Se limpiarán los documentos y el usuario deberá reenviarlos.';
                
            if (!confirm(confirmMsg)) return;
            
            const datosActualizar = { 
                estado_kyc: nuevoEstado, 
                ultima_actualizacion: new Date().toISOString() 
            };
            
            if (nuevoEstado === 'rechazado') {
                datosActualizar.documento_frontal_url = null;
                datosActualizar.documento_trasero_url = null;
                datosActualizar.selfie_url = null;
            }
            
            // Deshabilitar botones temporalmente
            const card = document.getElementById(`kyc-card-${userId}`);
            const buttons = card.querySelectorAll('.btn-approve, .btn-reject');
            buttons.forEach(btn => { btn.disabled = true; btn.style.opacity = '0.5'; });
            
            const { error } = await db.from('perfiles').update(datosActualizar).eq('id', userId);
            
            if (error) { 
                alert('❌ Error: ' + error.message); 
                buttons.forEach(btn => { btn.disabled = false; btn.style.opacity = '1'; });
            } else { 
                alert(`✅ KYC ${nuevoEstado === 'verificado' ? 'APROBADO' : 'RECHAZADO'} exitosamente.`); 
                await cargarEstadisticas(); 
                await cargarSolicitudesKYC(); 
            }
        };

        // ========== INICIALIZAR ==========
        await cargarEstadisticas();
        await cargarSolicitudesKYC();
    });
    </script>
</body>
</html>
