<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin KYC - Boche Clava'o</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background: #000000; 
            min-height: 100vh; 
            color: #ffffff; 
            padding: 20px;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 215, 0, 0.03) 0%, transparent 25%);
        }
        
        .back-link { 
            display: inline-flex; 
            align-items: center; 
            gap: 8px;
            margin-bottom: 20px; 
            color: #FFD700; 
            text-decoration: none; 
            padding: 10px 20px; 
            border: 1px solid #FFD700; 
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .back-link:hover { background: #FFD700; color: #000; transform: translateX(-5px); }
        
        .module-header { 
            text-align: center; 
            margin-bottom: 30px; 
            padding: 25px; 
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%); 
            border-radius: 12px; 
            border: 1px solid #FFD700;
            max-width: 1400px;
            margin: 0 auto 30px;
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.1);
        }
        .module-header h1 { 
            color: #FFD700; 
            font-size: 1.8rem; 
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .module-header p { color: #999; font-size: 0.95rem; }
        
        /* ========== BARRA DE BÚSQUEDA Y FILTROS ========== */
        .search-filter-bar {
            max-width: 1200px;
            margin: 0 auto 25px;
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 20px;
        }
        
        .search-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        
        .search-select,
        .search-input {
            padding: 12px 16px;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s;
        }
        .search-input:focus, .search-select:focus {
            outline: none;
            border-color: #FFD700;
        }
        .search-select { min-width: 180px; }
        .search-input { flex: 1; min-width: 200px; }
        
        .filter-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid #222;
        }
        
        .filter-label {
            color: #FFD700;
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .date-input {
            padding: 10px 14px;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
        }
        .date-input:focus { outline: none; border-color: #FFD700; }
        
        .btn { 
            padding: 10px 18px; 
            border: none; 
            border-radius: 8px; 
            font-weight: 700; 
            cursor: pointer; 
            font-family: 'Montserrat', sans-serif; 
            transition: all 0.3s; 
            display: inline-flex; 
            align-items: center; 
            gap: 8px;
            font-size: 0.85rem;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-search { background: #FFD700; color: #000; }
        .btn-search:hover { background: #FFC700; }
        .btn-clear { background: #333; color: #fff; }
        .btn-clear:hover { background: #444; }
        .btn-approve { background: #00ff00; color: #000; padding: 12px 25px; font-size: 0.9rem; }
        .btn-approve:hover { background: #00cc00; }
        .btn-reject { background: #ff4444; color: #fff; padding: 12px 25px; font-size: 0.9rem; }
        .btn-reject:hover { background: #cc0000; }
        
        /* ========== ESTADÍSTICAS ========== */
        .stats-bar { 
            display: flex; 
            gap: 15px; 
            justify-content: center; 
            margin-bottom: 25px; 
            flex-wrap: wrap;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }
        .stat-box { 
            background: #0a0a0a; 
            border: 1px solid #222; 
            padding: 15px; 
            border-radius: 8px; 
            text-align: center; 
            min-width: 130px; 
            flex: 1; 
            max-width: 180px;
            transition: all 0.3s;
        }
        .stat-box:hover { border-color: #FFD700; transform: translateY(-3px); }
        .stat-box .number { font-size: 1.8rem; font-weight: 800; color: #FFD700; }
        .stat-box .label { color: #999; font-size: 0.8rem; margin-top: 5px; }
        
        /* ========== INFO DE RESULTADOS ========== */
        .results-info {
            max-width: 1200px;
            margin: 0 auto 15px;
            padding: 12px 20px;
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid #FFD700;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .results-info-text {
            color: #FFD700;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        /* ========== CARDS KYC COLAPSABLES ========== */
        .kyc-card { 
            background: #0a0a0a; 
            border: 1px solid #222; 
            border-radius: 12px; 
            margin-bottom: 12px; 
            max-width: 1200px; 
            margin-left: auto; 
            margin-right: auto;
            transition: all 0.3s;
            overflow: hidden;
        }
        .kyc-card:hover { border-color: #FFD700; box-shadow: 0 5px 20px rgba(255, 215, 0, 0.1); }
        
        .kyc-card-header {
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.3s;
            gap: 15px;
            flex-wrap: wrap;
        }
        .kyc-card-header:hover { background: rgba(255, 215, 0, 0.03); }
        
        .kyc-card-main-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
            min-width: 0;
            flex-wrap: wrap;
        }
        
        .kyc-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #000;
            font-size: 1.3rem;
            flex-shrink: 0;
        }
        
        .kyc-user-info {
            flex: 1;
            min-width: 0;
        }
        
        .kyc-user-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .kyc-user-meta {
            display: flex;
            gap: 12px;
            font-size: 0.8rem;
            color: #999;
            flex-wrap: wrap;
        }
        .kyc-user-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .kyc-user-meta i { color: #FFD700; }
        
        .kyc-card-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        
        .status-badge { 
            padding: 5px 12px; 
            border-radius: 20px; 
            font-size: 0.75rem; 
            font-weight: 700; 
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-pending { background: rgba(255, 165, 0, 0.2); color: #FFA500; border: 1px solid #FFA500; }
        .status-verified { background: rgba(0, 255, 0, 0.2); color: #00ff00; border: 1px solid #00ff00; }
        .status-rejected { background: rgba(255, 0, 0, 0.2); color: #ff4444; border: 1px solid #ff4444; }
        
        .expand-icon {
            color: #FFD700;
            transition: transform 0.3s;
            font-size: 1rem;
        }
        .kyc-card.expanded .expand-icon {
            transform: rotate(180deg);
        }
        
        /* ========== CONTENIDO EXPANDIBLE ========== */
        .kyc-card-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-in-out;
        }
        .kyc-card.expanded .kyc-card-content {
            max-height: 2000px;
        }
        
        .kyc-content-inner {
            padding: 0 20px 20px;
            border-top: 1px solid #222;
        }
        
        .section-title {
            color: #FFD700;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 20px 0 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #222;
        }
        
        .info-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 12px; 
        }
        .info-item label { 
            display: block; 
            color: #666; 
            font-size: 0.75rem; 
            margin-bottom: 4px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .info-item span { color: #fff; font-weight: 600; font-size: 0.9rem; word-break: break-all; }
        
        .images-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 15px; 
        }
        .image-box { text-align: center; }
        .image-box img { 
            width: 100%; 
            border-radius: 8px; 
            border: 2px solid #333; 
            margin-bottom: 8px; 
            height: 180px; 
            object-fit: cover; 
            cursor: pointer;
            transition: all 0.3s;
        }
        .image-box img:hover { border-color: #FFD700; transform: scale(1.03); }
        .image-box p { font-size: 0.8rem; color: #999; font-weight: 600; }
        
        .kyc-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #222;
        }
        
        /* ========== PAGINACIÓN ========== */
        .pagination { 
            display: flex; 
            gap: 8px; 
            justify-content: center; 
            margin-top: 30px; 
            flex-wrap: wrap;
            align-items: center;
            padding: 20px;
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 12px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        .page-btn { 
            padding: 10px 14px; 
            background: #111; 
            border: 1px solid #333; 
            border-radius: 6px; 
            color: #fff; 
            cursor: pointer; 
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
            min-width: 40px;
        }
        .page-btn:hover:not(:disabled) { border-color: #FFD700; color: #FFD700; }
        .page-btn.active { background: #FFD700; color: #000; border-color: #FFD700; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .page-info {
            color: #999;
            font-size: 0.85rem;
            margin: 0 10px;
        }
        
        /* ========== ESTADOS VACÍOS ========== */
        .loading { text-align: center; color: #FFD700; margin: 50px 0; font-size: 1.2rem; }
        .empty { 
            text-align: center; 
            color: #666; 
            padding: 60px 40px;
            font-size: 1rem;
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 12px;
            max-width: 600px;
            margin: 30px auto;
        }
        .empty i { font-size: 3rem; margin-bottom: 15px; display: block; }
        
        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .module-header h1 { font-size: 1.3rem; flex-direction: column; }
            .stat-box { min-width: 100px; padding: 10px; }
            .stat-box .number { font-size: 1.4rem; }
            .kyc-card-header { padding: 12px 15px; }
            .kyc-avatar { width: 40px; height: 40px; font-size: 1rem; }
            .kyc-user-name { font-size: 0.95rem; }
            .kyc-user-meta { font-size: 0.7rem; }
            .kyc-content-inner { padding: 0 15px 15px; }
            .search-filter-bar { padding: 15px; }
            .filter-row { flex-direction: column; align-items: stretch; }
            .date-input { width: 100%; }
        }
    </style>
</head>
<body>
    <a href="admin.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Volver al Panel
    </a>

    <div class="module-header">
        <h1><i class="fas fa-id-card"></i> Verificaciones KYC</h1>
        <p>Revisa y aprueba documentos de identidad de los usuarios</p>
    </div>

    <!-- ========== BARRA DE BÚSQUEDA Y FILTROS ========== -->
    <div class="search-filter-bar">
        <div class="search-row">
            <select id="searchType" class="search-select">
                <option value="user_id">🔍 Buscar por ID (BC-xxxx)</option>
                <option value="numero_documento">🆔 Buscar por Cédula</option>
                <option value="nombre">👤 Buscar por Nombre</option>
                <option value="email">📧 Buscar por Email</option>
            </select>
            <input type="text" id="searchInput" class="search-input" placeholder="Escribe el ID, cédula, nombre o email...">
            <button class="btn btn-search" id="btnBuscar">
                <i class="fas fa-search"></i> Buscar
            </button>
            <button class="btn btn-clear" id="btnLimpiar">
                <i class="fas fa-times"></i> Limpiar
            </button>
        </div>
        
        <div class="filter-row">
            <span class="filter-label"><i class="fas fa-calendar-alt"></i> Filtrar por fecha:</span>
            <input type="date" id="fechaDesde" class="date-input" title="Fecha desde">
            <span style="color: #666;">→</span>
            <input type="date" id="fechaHasta" class="date-input" title="Fecha hasta">
            <button class="btn btn-search" id="btnAplicarFiltro">
                <i class="fas fa-filter"></i> Aplicar
            </button>
        </div>
    </div>

    <!-- ========== ESTADÍSTICAS ========== -->
    <div id="statsBar" class="stats-bar"></div>
    
    <!-- ========== INFO DE RESULTADOS ========== -->
    <div id="resultsInfo" class="results-info" style="display: none;">
        <span class="results-info-text" id="resultsInfoText"></span>
    </div>
    
    <!-- ========== LOADING ========== -->
    <div id="loadingKyc" class="loading">
        <i class="fas fa-circle-notch fa-spin"></i> Cargando solicitudes KYC...
    </div>
    
    <!-- ========== CONTENEDOR DE CARDS ========== -->
    <div id="containerKyc"></div>
    
    <!-- ========== PAGINACIÓN ========== -->
    <div id="pagination" class="pagination" style="display: none;"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/admin-kyc.js"></script>
</body>
</html>
