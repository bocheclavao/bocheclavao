<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin KYC - Boche Clava'o</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background: #000000; 
            min-height: 100vh; 
            color: #ffffff; 
            padding: 20px;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 215, 0, 0.03) 0%, transparent 25%);
        }
        
        .back-link { 
            display: inline-flex; 
            align-items: center; 
            gap: 8px;
            margin-bottom: 20px; 
            color: #FFD700; 
            text-decoration: none; 
            padding: 10px 20px; 
            border: 1px solid #FFD700; 
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .back-link:hover { background: #FFD700; color: #000; transform: translateX(-5px); }
        
        .module-header { 
            text-align: center; 
            margin-bottom: 30px; 
            padding: 25px; 
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%); 
            border-radius: 12px; 
            border: 1px solid #FFD700;
            max-width: 1400px;
            margin: 0 auto 30px;
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.1);
        }
        .module-header h1 { 
            color: #FFD700; 
            font-size: 1.8rem; 
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .module-header p { color: #999; font-size: 0.95rem; }
        
        .stats-bar { 
            display: flex; 
            gap: 15px; 
            justify-content: center; 
            margin-bottom: 30px; 
            flex-wrap: wrap;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }
        .stat-box { 
            background: #0a0a0a; 
            border: 1px solid #222; 
            padding: 20px; 
            border-radius: 8px; 
            text-align: center; 
            min-width: 150px; 
            flex: 1; 
            max-width: 200px;
            transition: all 0.3s;
        }
        .stat-box:hover {
            border-color: #FFD700;
            transform: translateY(-3px);
        }
        .stat-box .number { font-size: 2rem; font-weight: 800; color: #FFD700; }
        .stat-box .label { color: #999; font-size: 0.85rem; margin-top: 5px; }
        
        .user-card { 
            background: #0a0a0a; 
            border: 1px solid #222; 
            border-radius: 12px; 
            padding: 25px; 
            margin-bottom: 20px; 
            max-width: 900px; 
            margin-left: auto; 
            margin-right: auto;
            transition: all 0.3s;
        }
        .user-card:hover {
            border-color: #FFD700;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.1);
        }
        .user-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            border-bottom: 1px solid #333; 
            padding-bottom: 15px; 
            flex-wrap: wrap; 
            gap: 10px; 
        }
        .user-name { font-size: 1.3rem; font-weight: 700; color: #FFD700; }
        .user-id { color: #999; font-size: 0.9rem; margin-top: 4px; }
        
        .status-badge { 
            padding: 5px 12px; 
            border-radius: 20px; 
            font-size: 0.8rem; 
            font-weight: 700; 
            display: inline-block;
        }
        .status-pending { background: rgba(255, 165, 0, 0.2); color: #FFA500; border: 1px solid #FFA500; }
        .status-verified { background: rgba(0, 255, 0, 0.2); color: #00ff00; border: 1px solid #00ff00; }
        .status-rejected { background: rgba(255, 0, 0, 0.2); color: #ff4444; border: 1px solid #ff4444; }
        
        .info-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 15px; 
            margin-bottom: 20px; 
        }
        .info-item label { 
            display: block; 
            color: #666; 
            font-size: 0.8rem; 
            margin-bottom: 5px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .info-item span { color: #fff; font-weight: 600; word-break: break-all; }
        
        .images-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 15px; 
            margin-bottom: 20px; 
        }
        .image-box { text-align: center; }
        .image-box img { 
            width: 100%; 
            border-radius: 8px; 
            border: 1px solid #333; 
            margin-bottom: 8px; 
            max-height: 200px; 
            object-fit: cover; 
            cursor: pointer;
            transition: all 0.3s;
        }
        .image-box img:hover { border-color: #FFD700; transform: scale(1.02); }
        .image-box p { font-size: 0.85rem; color: #999; }
        
        .actions { 
            display: flex; 
            gap: 15px; 
            justify-content: center; 
            flex-wrap: wrap; 
        }
        
        .btn { 
            padding: 12px 25px; 
            border: none; 
            border-radius: 8px; 
            font-weight: 700; 
            cursor: pointer; 
            font-family: 'Montserrat', sans-serif; 
            transition: all 0.3s; 
            display: flex; 
            align-items: center; 
            gap: 8px;
            font-size: 0.9rem;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .btn-approve { background: #00ff00; color: #000; }
        .btn-approve:hover { background: #00cc00; }
        .btn-reject { background: #ff4444; color: #fff; }
        .btn-reject:hover { background: #cc0000; }
        
        .loading { 
            text-align: center; 
            color: #FFD700; 
            margin-top: 50px; 
            font-size: 1.2rem; 
        }
        .empty { 
            text-align: center; 
            color: #666; 
            margin-top: 50px; 
            padding: 40px;
            font-size: 1.1rem;
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 12px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        @media (max-width: 768px) {
            .module-header h1 { font-size: 1.3rem; }
            .stat-box { min-width: 120px; }
            .user-card { padding: 15px; }
            .user-name { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <a href="admin.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Volver al Panel
    </a>

    <div class="module-header">
        <h1><i class="fas fa-id-card"></i> Verificaciones KYC</h1>
        <p>Revisa y aprueba documentos de identidad de los usuarios</p>
    </div>

    <div id="statsBar" class="stats-bar"></div>
    
    <div id="loadingKyc" class="loading">
        <i class="fas fa-circle-notch fa-spin"></i> Cargando solicitudes KYC...
    </div>
    
    <div id="containerKyc"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/admin-kyc.js"></script>
</body>
</html>
