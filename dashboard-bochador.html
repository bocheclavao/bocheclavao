<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boche Clava'o - Perfil del Bochador</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../img/moneda.png">
    
    <style>
        :root {
            --azul-electrico: #0057FF;
            --rojo: #FF1B1B;
            --negro-fondo: #050505;
            --negro-superficie: #0F0F10;
            --negro-superficie-2: #161618;
            --gris-texto: #9A9DA6;
            --gris-borde: rgba(255, 255, 255, 0.06);
            --dorado: #FFD700;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--negro-fondo);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar {
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--gris-borde);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .btn-volver {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 14px; background: rgba(255,255,255,0.03);
            border: 1px solid var(--gris-borde); border-radius: 8px;
            color: var(--gris-texto); text-decoration: none;
            font-size: 0.85rem; font-weight: 600; transition: all 0.3s ease;
        }
        .btn-volver:hover { color: var(--dorado); border-color: var(--dorado); }
        .navbar-title { font-size: 1.1rem; font-weight: 800; color: var(--dorado); letter-spacing: 1px; text-transform: uppercase; }

        .main-content { flex: 1; padding: 30px 24px; max-width: 1000px; margin: 0 auto; width: 100%; }

        /* Ficha del Bochador */
        .profile-header {
            background: var(--negro-superficie);
            border: 1px solid var(--gris-borde);
            border-radius: 16px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
        }
        .profile-photo-container {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid var(--dorado);
            overflow: hidden;
            margin-bottom: 20px;
            background: var(--negro-superficie-2);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-photo { width: 100%; height: 100%; object-fit: cover; }
        .profile-photo-placeholder { font-size: 3rem; color: var(--gris-texto); }
        
        .profile-name { font-size: 1.8rem; font-weight: 800; color: #fff; text-align: center; margin-bottom: 8px; }
        .profile-id { font-size: 0.9rem; color: var(--gris-texto); font-family: monospace; background: var(--negro-superficie-2); padding: 4px 12px; border-radius: 20px; }

        .status-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .status-no-cls { background: rgba(154, 157, 166, 0.2); color: var(--gris-texto); border: 1px solid var(--gris-texto); }
        .status-cls { background: rgba(0, 255, 0, 0.15); color: #00ff00; border: 1px solid #00ff00; }

        /* Grid de Datos */
        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .data-card {
            background: var(--negro-superficie);
            border: 1px solid var(--gris-borde);
            border-radius: 12px;
            padding: 20px;
        }
        .data-card-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--dorado);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--gris-borde);
        }
        .data-row:last-child { border-bottom: none; }
        .data-label { font-size: 0.9rem; color: var(--gris-texto); font-weight: 500; }
        .data-value { 
            font-size: 0.95rem; 
            color: #fff; 
            font-weight: 600; 
            text-align: right;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .locked-icon { color: var(--gris-texto); font-size: 0.8rem; opacity: 0.5; }
        .flag-icon { font-size: 1.2rem; }

        .category-highlight {
            background: var(--dorado);
            color: #000;
            padding: 2px 10px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 1.1rem;
        }

        .loading-state { text-align: center; padding: 50px; color: var(--gris-texto); }

        @media (max-width: 768px) {
            .profile-header { padding: 20px; }
            .status-badge { position: static; margin-top: 10px; }
            .data-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="hub-juegos.html" class="btn-volver">
            <i class="fas fa-arrow-left"></i> Volver al Hub
        </a>
        <span class="navbar-title">Ficha del Bochador</span>
    </nav>

    <div class="main-content" id="mainContent">
        <div class="loading-state">
            <i class="fas fa-circle-notch fa-spin fa-2x"></i>
            <p style="margin-top: 15px;">Cargando ficha deportiva...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="js/dashboard-bochador.js"></script>
</body>
</html>
