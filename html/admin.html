<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Boche Clava'o</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background: #000000; min-height: 100vh; color: #ffffff; padding: 20px; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { color: #FFD700; font-size: 2rem; margin-bottom: 10px; }
        .user-card { background: #0a0a0a; border: 1px solid #222; border-radius: 12px; padding: 25px; margin-bottom: 20px; max-width: 800px; margin-left: auto; margin-right: auto; }
        .user-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .user-name { font-size: 1.3rem; font-weight: 700; color: #FFD700; }
        .user-id { color: #999; font-size: 0.9rem; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .info-item label { display: block; color: #666; font-size: 0.8rem; margin-bottom: 5px; }
        .info-item span { color: #fff; font-weight: 600; }
        .images-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .image-box { text-align: center; }
        .image-box img { width: 100%; border-radius: 8px; border: 1px solid #333; margin-bottom: 8px; }
        .image-box p { font-size: 0.85rem; color: #999; }
        .actions { display: flex; gap: 15px; justify-content: center; }
        .btn { padding: 12px 25px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-family: 'Montserrat', sans-serif; transition: all 0.3s; }
        .btn-approve { background: #00ff00; color: #000; }
        .btn-approve:hover { background: #00cc00; }
        .btn-reject { background: #ff4444; color: #fff; }
        .btn-reject:hover { background: #cc0000; }
        .loading { text-align: center; color: #FFD700; margin-top: 50px; }
        .empty { text-align: center; color: #666; margin-top: 50px; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #FFD700; text-decoration: none; }
    </style>
</head>
<body>
    <a href="dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Volver al Dashboard</a>
    <div class="header">
        <h1><i class="fas fa-user-shield"></i> Panel de Verificación KYC</h1>
        <p>Revisa los documentos y aprueba o rechaza las solicitudes.</p>
    </div>

    <div id="loading" class="loading"><i class="fas fa-circle-notch fa-spin"></i> Cargando solicitudes...</div>
    <div id="container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
