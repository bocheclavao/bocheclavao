<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boche Clava'o - Recuperar Contraseña</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 20px;
        }

        .container { width: 100%; max-width: 400px; }

        .logo-container { text-align: center; margin-bottom: 30px; }

        .logo-main { max-width: 140px; height: auto; margin-bottom: 15px; }

        .brand-name {
            font-size: 1.6rem;
            font-weight: 800;
            color: #FFD700;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .card {
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .card-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
            text-align: center;
        }

        .card-subtitle {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group { margin-bottom: 20px; }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem; /* Tamaño 16px evita que el iPhone haga zoom al tocar el input */
            font-family: 'Montserrat', sans-serif;
            transition: all 0.3s ease;
            -webkit-appearance: none; /* Quita estilos por defecto en iOS */
        }

        .form-group input:focus {
            outline: none;
            border-color: #FFD700;
            background: #1a1a1a;
        }

        .form-group input::placeholder { color: #666; }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent; /* Quita el flash azul al tocar en móviles */
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            display: none;
            font-size: 0.85rem;
        }

        .message.success {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            color: #00ff00;
            display: block;
        }

        .message.error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff0000;
            color: #ff0000;
            display: block;
        }

        .message.info {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid #FFD700;
            color: #FFD700;
            display: block;
        }

        .back-link { text-align: center; margin-top: 25px; }

        .back-link a {
            color: #FFD700;
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-block;
            padding: 10px; /* Área de toque más grande para el dedo */
        }

        /* 📱 OPTIMIZACIÓN PARA CELULARES */
        @media (max-width: 480px) {
            body {
                padding: 15px;
                align-items: flex-start; /* Empuja el contenido un poco hacia arriba en móviles */
                padding-top: 10vh;
            }

            .container {
                max-width: 100%;
            }

            .logo-main {
                max-width: 110px; /* Logo un poco más pequeño */
            }

            .brand-name {
                font-size: 1.4rem;
                letter-spacing: 2px;
            }

            .card {
                padding: 25px 20px; /* Menos padding para ganar espacio */
                border-radius: 10px;
            }

            .card-title {
                font-size: 1.4rem;
            }

            .card-subtitle {
                font-size: 0.85rem;
                margin-bottom: 25px;
            }

            .form-group input {
                padding: 12px 14px;
            }

            .btn-primary {
                padding: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="../img/logo.png" alt="Boche Clava'o" class="logo-main">
            <h1 class="brand-name">Boche Clava'o</h1>
        </div>

        <div class="card">
            <h2 class="card-title">Nueva Contraseña</h2>
            <p class="card-subtitle">Ingresa tu nueva contraseña</p>
            
            <form id="resetForm">
                <div class="form-group">
                    <input type="password" id="newPassword" required placeholder="Nueva contraseña" minlength="6">
                </div>

                <div class="form-group">
                    <input type="password" id="confirmPassword" required placeholder="Confirmar contraseña" minlength="6">
                </div>

                <button type="submit" class="btn-primary">Actualizar Contraseña</button>
            </form>

            <div id="message" class="message"></div>

            <div class="back-link">
                <a href="login.html">← Volver al login</a>
            </div>
        </div>
    </div>

    <!-- Scripts separados -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/recuperar-contrasena.js"></script>
</body>
</html>
