<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boche Clava'o - Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        /* Fondo decorativo con serpentinas doradas */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 215, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 165, 0, 0.1) 0%, transparent 50%);
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* Menú superior */
        .navbar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .navbar a {
            color: #FFD700;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .navbar a:hover {
            color: #FFA500;
            transform: translateY(-2px);
        }

        .search-box {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid #FFD700;
            border-radius: 20px;
            padding: 8px 20px;
            color: #FFD700;
            font-size: 0.9rem;
        }

        /* Contenido principal */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Lado izquierdo - Texto */
        .left-side {
            text-align: left;
        }

        .celebrate-text {
            display: inline-block;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .main-title {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 2rem;
            color: #FFD700;
            font-style: italic;
            margin-bottom: 30px;
        }

        .event-info {
            color: #cccccc;
            font-size: 1rem;
            line-height: 1.6;
        }

        .event-info strong {
            color: #FFD700;
        }

        /* Lado derecho - Tarjeta VIP */
        .right-side {
            display: flex;
            justify-content: center;
        }

        .vip-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            border: 2px solid #FFD700;
            border-radius: 15px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.2);
            position: relative;
        }

        .vip-card::before {
            content: '🍺';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            background: #0a0a0a;
            padding: 0 10px;
        }

        .vip-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 215, 0, 0.05);
            border: 2px solid #FFD700;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        .form-group input::placeholder {
            color: #999;
        }

        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn-primary {
            flex: 1;
            padding: 14px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
        }

        .btn-secondary {
            flex: 1;
            padding: 14px;
            background: transparent;
            color: #FFD700;
            border: 2px solid #FFD700;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-secondary:hover {
            background: rgba(255, 215, 0, 0.1);
            transform: translateY(-2px);
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            color: #666;
            font-size: 0.9rem;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #333;
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        .btn-google {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            color: #333;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-google:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 255, 255, 0.2);
        }

        .btn-google img {
            width: 20px;
            height: 20px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .social-icons a {
            color: #FFD700;
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }

        .social-icons a:hover {
            color: #FFA500;
            transform: translateY(-3px);
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .message.success {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            color: #00ff00;
            display: block;
        }

        .message.error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff0000;
            color: #ff0000;
            display: block;
        }

        .message.info {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid #FFD700;
            color: #FFD700;
            display: block;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .left-side {
                text-align: center;
            }

            .main-title {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1.5rem;
            }

            .navbar {
                gap: 15px;
            }

            .vip-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Menú superior -->
        <nav class="navbar">
            <a href="#">Inicio</a>
            <a href="#">Acerca de</a>
            <a href="#">Reservaciones</a>
            <a href="#">Servicios</a>
            <div class="search-box">🔍 Buscar</div>
        </nav>

        <!-- Contenido principal -->
        <div class="main-content">
            <!-- Lado izquierdo -->
            <div class="left-side">
                <div class="celebrate-text">Celebra tu</div>
                <h1 class="main-title">Fiesta<br>Exclusiva</h1>
                <h2 class="subtitle">Boche Clava'o</h2>
                <p class="event-info">
                    <strong>Diciembre 31° Antes de Medianoche</strong><br>
                    Únete a la mejor fiesta del año. Experiencia VIP, música en vivo y los mejores momentos.
                </p>
            </div>

            <!-- Lado derecho - Tarjeta VIP -->
            <div class="right-side">
                <div class="vip-card">
                    <h2 class="vip-title">VIP Card</h2>
                    
                    <form id="loginForm">
                        <div class="form-group">
                            <input type="email" id="email" required placeholder="Correo electrónico">
                        </div>

                        <div class="form-group">
                            <input type="password" id="password" required placeholder="Contraseña">
                        </div>

                        <div class="btn-container">
                            <button type="submit" class="btn-primary">Ingresar</button>
                            <button type="button" class="btn-secondary" onclick="window.location.href='registro.html'">Registrar</button>
                        </div>
                    </form>

                    <div class="divider">o</div>

                    <button class="btn-google" onclick="loginWithGoogle()">
                        <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google">
                        Continuar con Google
                    </button>

                    <div class="social-icons">
                        <a href="#"><i class="fab fa-instagram"></i></a>
                        <a href="#"><i class="fab fa-facebook"></i></a>
                        <a href="#"><i class="fab fa-twitter"></i></a>
                    </div>

                    <div id="message" class="message"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
