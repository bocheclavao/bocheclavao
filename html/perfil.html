<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boche Clava'o - Mi Perfil</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #000000;
            min-height: 100vh;
            color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: #0a0a0a;
            border-bottom: 1px solid #222;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .navbar-logo {
            max-width: 40px;
            height: auto;
        }

        .navbar-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: #FFD700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .btn-back {
            background: transparent;
            color: #FFD700;
            border: 1px solid #FFD700;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            text-decoration: none;
        }

        .btn-back:hover {
            background: #FFD700;
            color: #000;
        }

        .main-content {
            flex: 1;
            padding: 30px 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .loading-container {
            text-align: center;
            margin-top: 50px;
            color: #FFD700;
            font-size: 1.2rem;
        }

        .profile-header {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            border: 1px solid #222;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #FFD700;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 800;
            color: #000;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
        }

        .profile-name {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .profile-id {
            display: inline-block;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid #FFD700;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #FFD700;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .profile-email {
            color: #999;
            font-size: 0.95rem;
        }

        .kyc-status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: 700;
        }

        .kyc-status.pending {
            background: rgba(255, 165, 0, 0.1);
            border: 1px solid #FFA500;
            color: #FFA500;
        }

        .kyc-status.verified {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            color: #00ff00;
        }

        .kyc-status.rejected {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff4444;
            color: #ff4444;
        }

        .form-section {
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .form-section h2 {
            font-size: 1.3rem;
            font-weight: 800;
            color: #FFD700;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #cccccc;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #FFD700;
            background: #1a1a1a;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Montserrat', sans-serif;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            display: none;
            font-size: 0.85rem;
        }

        .message.success {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            color: #00ff00;
            display: block;
        }

        .message.error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff0000;
            color: #ff0000;
            display: block;
        }

        .message.info {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid #FFD700;
            color: #FFD700;
            display: block;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .profile-name {
                font-size: 1.5rem;
            }

            .form-section {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <img src="../img/logo.png" alt="Logo" class="navbar-logo">
            <span class="navbar-title">Boche Clava'o</span>
        </div>
        <a href="dashboard.html" class="btn-back">
            <i class="fas fa-arrow-left"></i> Volver
        </a>
    </nav>

    <div class="main-content">
        <div id="loadingState" class="loading-container">
            <i class="fas fa-circle-notch fa-spin"></i> Cargando perfil...
        </div>

        <div id="contentState" style="display: none;">
            <!-- Header del perfil -->
            <div class="profile-header">
                <div class="profile-avatar" id="profileAvatar">?</div>
                <h1 class="profile-name" id="profileName">Usuario</h1>
                <div class="profile-id" id="profileId">ID: BC-00000000</div>
                <p class="profile-email" id="profileEmail">email@ejemplo.com</p>
                <div class="kyc-status pending" id="kycStatus">
                    <i class="fas fa-clock"></i> KYC Pendiente
                </div>
            </div>

            <!-- Formulario de información personal -->
            <div class="form-section">
                <h2><i class="fas fa-user"></i> Información Personal</h2>
                <form id="personalForm">
                    <div class="form-group">
                        <label for="nombre">Nombre completo *</label>
                        <input type="text" id="nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" placeholder="+57 300 000 0000">
                    </div>
                    <div class="form-group">
                        <label for="fechaNacimiento">Fecha de nacimiento *</label>
                        <input type="date" id="fechaNacimiento" required>
                    </div>
                    <div class="form-group">
                        <label for="nacionalidad">Nacionalidad *</label>
                        <input type="text" id="nacionalidad" required>
                    </div>
                    <button type="submit" class="btn-primary">Guardar información</button>
                </form>
            </div>

            <!-- Formulario KYC -->
            <div class="form-section">
                <h2><i class="fas fa-shield-alt"></i> Verificación KYC</h2>
                <form id="kycForm">
                    <div class="form-group">
                        <label for="tipoDocumento">Tipo de documento *</label>
                        <select id="tipoDocumento" required>
                            <option value="">Selecciona...</option>
                            <option value="cedula">Cédula de identidad</option>
                            <option value="pasaporte">Pasaporte</option>
                            <option value="licencia">Licencia de conducir</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="numeroDocumento">Número de documento *</label>
                        <input type="text" id="numeroDocumento" required>
                    </div>
                    <div class="form-group">
                        <label for="direccion">Dirección *</label>
                        <input type="text" id="direccion" required>
                    </div>
                    <div class="form-group">
                        <label for="ciudad">Ciudad *</label>
                        <input type="text" id="ciudad" required>
                    </div>
                    <div class="form-group">
                        <label for="pais">País *</label>
                        <input type="text" id="pais" required>
                    </div>
                    <div class="form-group">
                        <label for="codigoPostal">Código postal</label>
                        <input type="text" id="codigoPostal">
                    </div>
                    <button type="submit" class="btn-primary">Enviar documentos para verificación</button>
                </form>
            </div>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/perfil.js"></script>
</body>
</html>
