<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - Gestión de Bochadores</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../img/moneda.png">
    
    <style>
        :root {
            --dorado: #FFD700;
            --dorado-oscuro: #B8860B;
            --negro-fondo: #000000;
            --negro-superficie: #0F0F10;
            --gris-texto: #9A9DA6;
            --gris-borde: rgba(255, 255, 255, 0.1);
            --exito: #00ff00;
            --error: #ff4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--negro-fondo);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: rgba(15, 15, 16, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--gris-borde);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .btn-volver {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 16px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--gris-borde); border-radius: 8px;
            color: var(--dorado); text-decoration: none;
            font-weight: 600; font-size: 0.9rem; transition: all 0.3s ease;
        }
        .btn-volver:hover { background: rgba(255, 215, 0, 0.1); border-color: var(--dorado); }

        .page-title { font-size: 1.2rem; font-weight: 800; color: var(--dorado); text-transform: uppercase; letter-spacing: 1px; }

        .main-content { flex: 1; padding: 30px 24px; max-width: 1000px; margin: 0 auto; width: 100%; }

        .search-box {
            background: var(--negro-superficie);
            border: 1px solid var(--gris-borde);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 30px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
            padding: 12px 16px;
            background: var(--negro-fondo);
            border: 1px solid var(--gris-borde);
            border-radius: 8px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
        }
        .search-input:focus { outline: none; border-color: var(--dorado); }

        .btn-primary {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--dorado) 0%, var(--dorado-oscuro) 100%);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .form-container {
            background: var(--negro-superficie);
            border: 1px solid var(--gris-borde);
            border-radius: 12px;
            padding: 30px;
            display: none; /* Oculto hasta que se busque un usuario */
        }
        .form-container.active { display: block; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--gris-borde);
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .user-header h3 { color: var(--dorado); font-size: 1.3rem; }
        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .status-pendiente { background: rgba(255, 68, 68, 0.15); color: var(--error); border: 1px solid rgba(255, 68, 68, 0.3); }
        .status-clasificado { background: rgba(0, 255, 0, 0.15); color: var(--exito); border: 1px solid rgba(0, 255, 0, 0.3); }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--gris-texto); }
        .form-group input, .form-group select {
            padding: 10px 14px;
            background: var(--negro-fondo);
            border: 1px solid var(--gris-borde);
            border-radius: 8px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--dorado); }
        .form-group select option { background: var(--negro-fondo); color: #fff; }

        .form-actions {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--gris-borde);
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .message {
            padding: 14px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .message.success { background: rgba(0, 255, 0, 0.1); border: 1px solid var(--exito); color: var(--exito); display: flex; }
        .message.error { background: rgba(255, 68, 68, 0.1); border: 1px solid var(--error); color: var(--error); display: flex; }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .search-box { flex-direction: column; }
            .btn-primary { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="admin.html" class="btn-volver">
            <i class="fas fa-arrow-left"></i> Volver al Panel
        </a>
        <span class="page-title"><i class="fas fa-running"></i> Gestión de Bochadores</span>
    </nav>

    <div class="main-content">
        <div id="messageBox" class="message"></div>

        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="Buscar por Correo Electrónico o ID de Usuario (ej: BC-123456)">
            <button id="searchBtn" class="btn-primary">
                <i class="fas fa-search"></i> Buscar Jugador
            </button>
        </div>

        <div id="formContainer" class="form-container">
            <div class="user-header">
                <div>
                    <h3 id="userNameDisplay">Nombre del Jugador</h3>
                    <p id="userEmailDisplay" style="color: var(--gris-texto); font-size: 0.9rem;">correo@ejemplo.com</p>
                </div>
                <span id="userStatusBadge" class="status-badge status-pendiente">No Clasificado</span>
            </div>

            <form id="bochadorForm">
                <input type="hidden" id="userIdHidden">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nombre Completo</label>
                        <input type="text" id="nombreCompleto" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Nacionalidad</label>
                        <select id="nacionalidad" required>
                            <option value="Venezuela">🇻🇪 Venezuela</option>
                            <option value="Colombia">🇨🇴 Colombia</option>
                            <option value="México">🇲🇽 México</option>
                            <option value="Argentina">🇦🇷 Argentina</option>
                            <option value="España">🇪🇸 España</option>
                            <option value="Estados Unidos">🇺🇸 Estados Unidos</option>
                            <option value="Perú">🇵🇪 Perú</option>
                            <option value="Chile">🇨🇱 Chile</option>
                            <option value="Ecuador">🇪🇨 Ecuador</option>
                            <option value="Panamá">🇵🇦 Panamá</option>
                            <option value="Otro">🌍 Otro</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Mano Hábil</label>
                        <select id="manoHabil" required>
                            <option value="Diestro">Diestro</option>
                            <option value="Surdo">Surdo (Zurdo)</option>
                            <option value="Ambidiestro">Ambidiestro</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Peso (kg)</label>
                        <input type="number" id="peso" step="0.1" min="0" required>
                    </div>

                    <div class="form-group">
                        <label>Estatura (cm)</label>
                        <input type="number" id="estatura" min="0" required>
                    </div>

                    <div class="form-group">
                        <label>Longitud del Brazo (cm)</label>
                        <input type="number" id="longitudBrazo" step="0.1" min="0" required>
                    </div>

                    <div class="form-group">
                        <label>Sexo</label>
                        <select id="sexo" required>
                            <option value="Masculino">Masculino</option>
                            <option value="Femenino">Femenino</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Fecha de Nacimiento</label>
                        <input type="date" id="fechaNacimiento" required>
                    </div>

                    <div class="form-group">
                        <label>Edad</label>
                        <input type="number" id="edad" min="0" required>
                    </div>

                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="text" id="telefono" required>
                    </div>

                    <div class="form-group">
                        <label>Partidos Jugados</label>
                        <input type="number" id="partidosJugados" min="0" value="0" required>
                    </div>

                    <div class="form-group">
                        <label>Porcentaje de Aciertos (%)</label>
                        <input type="number" id="porcentajeAciertos" step="0.1" min="0" max="100" value="0" required>
                    </div>

                    <div class="form-group">
                        <label>Último Partido 1</label>
                        <input type="date" id="ultimoPartido1">
                    </div>

                    <div class="form-group">
                        <label>Último Partido 2</label>
                        <input type="date" id="ultimoPartido2">
                    </div>

                    <div class="form-group">
                        <label>Último Partido 3</label>
                        <input type="date" id="ultimoPartido3">
                    </div>

                    <div class="form-group">
                        <label>Categoría</label>
                        <select id="categoria" required>
                            <option value="F" selected>F (Inicial)</option>
                            <option value="E">E</option>
                            <option value="D">D</option>
                            <option value="C">C</option>
                            <option value="B">B</option>
                            <option value="A">A (Élite)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Estado de Clasificación</label>
                        <select id="estadoClasificacion" required>
                            <option value="No clasificado" selected>No clasificado</option>
                            <option value="Clasificado">Clasificado</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-primary" style="background: #333; color: #fff;" onclick="limpiarFormulario()">
                        <i class="fas fa-times"></i> Cancelar
                    </button>
                    <button type="submit" id="saveBtn" class="btn-primary">
                        <i class="fas fa-save"></i> Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/admin-bochadores.js"></script>
</body>
</html>
