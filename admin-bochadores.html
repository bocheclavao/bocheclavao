<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Gestión de Bochadores</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/img/moneda.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background: #000000; 
            min-height: 100vh; 
            color: #ffffff; 
            padding: 20px;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 215, 0, 0.03) 0%, transparent 25%);
        }
        
        .back-link { 
            display: inline-flex; align-items: center; gap: 8px;
            margin-bottom: 20px; color: #FFD700; text-decoration: none; 
            padding: 10px 20px; border: 1px solid #FFD700; border-radius: 8px;
            font-weight: 600; transition: all 0.3s;
        }
        .back-link:hover { background: #FFD700; color: #000; transform: translateX(-5px); }
        
        .header { 
            text-align: center; margin-bottom: 30px; padding: 30px; 
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%); 
            border-radius: 16px; border: 1px solid #FFD700;
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.1);
        }
        .header h1 { color: #FFD700; font-size: 2rem; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 15px; }
        .header p { color: #999; font-size: 1rem; }

        .search-container {
            max-width: 800px;
            margin: 0 auto 30px;
            display: flex;
            gap: 10px;
        }
        .search-input {
            flex: 1;
            padding: 15px 20px;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
        }
        .search-input:focus { outline: none; border-color: #FFD700; }
        .search-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Montserrat', sans-serif;
        }
        .search-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3); }
        .search-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .result-card {
            max-width: 800px;
            margin: 0 auto;
            background: linear-gradient(135deg, #0a0a0a 0%, #151515 100%);
            border: 1px solid #333;
            border-radius: 16px;
            padding: 30px;
            display: none;
        }
        .result-card.active { display: block; animation: fadeIn 0.4s ease; }

        .user-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }
        .info-item label {
            display: block;
            color: #999;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .info-item span {
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .status-verified { background: rgba(0, 255, 0, 0.15); color: #00ff00; border: 1px solid rgba(0, 255, 0, 0.3); }
        .status-pending { background: rgba(255, 165, 0, 0.15); color: #FFA500; border: 1px solid rgba(255, 165, 0, 0.3); }

        .evaluation-form {
            display: none;
        }
        .evaluation-form.active { display: block; }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .form-group label {
            display: block;
            color: #FFD700;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #FFD700;
        }
        .form-group select option {
            background: #111;
            color: #fff;
        }

        .save-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00cc00 0%, #009900 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .save-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0, 204, 0, 0.3); }
        .save-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            display: none;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .alert.active { display: flex; align-items: center; gap: 10px; animation: fadeIn 0.3s ease; }
        .alert-success { background: rgba(0, 255, 0, 0.1); border: 1px solid #00ff00; color: #00ff00; }
        .alert-error { background: rgba(255, 0, 0, 0.1); border: 1px solid #ff0000; color: #ff0000; }
        
        .warning-box {
            background: rgba(255, 165, 0, 0.1);
            border: 1px solid #FFA500;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            color: #FFA500;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .warning-box.active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .search-container { flex-direction: column; }
            .user-info-grid { grid-template-columns: 1fr; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <a href="admin.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Volver al Panel Admin
    </a>

    <div class="header">
        <h1><i class="fas fa-running"></i> Gestión de Bochadores</h1>
        <p>Busca un usuario por su correo o ID para evaluar su desempeño y asignar categoría</p>
    </div>

    <div id="alertBox" class="alert"></div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Ingresa el correo electrónico o ID del usuario (ej: BC-12345678)">
        <button id="searchBtn" class="search-btn">
            <i class="fas fa-search"></i> Buscar
        </button>
    </div>

    <div id="resultCard" class="result-card">
        <div class="user-info-grid">
            <div class="info-item">
                <label>Nombre</label>
                <span id="userName">-</span>
            </div>
            <div class="info-item">
                <label>Correo</label>
                <span id="userEmail">-</span>
            </div>
            <div class="info-item">
                <label>ID de Usuario</label>
                <span id="userId">-</span>
            </div>
            <div class="info-item">
                <label>Estado KYC</label>
                <span id="userKyc" class="status-badge">-</span>
            </div>
        </div>

        <div id="kycWarning" class="warning-box">
            <i class="fas fa-exclamation-triangle"></i>
            <span>Este usuario debe tener el KYC <strong>VERIFICADO</strong> antes de poder ser evaluado y clasificado.</span>
        </div>

        <form id="evaluationForm" class="evaluation-form">
            <h3 style="color: #FFD700; margin-bottom: 20px; font-size: 1.2rem;">
                <i class="fas fa-clipboard-check"></i> Formulario de Evaluación
            </h3>
            
            <div class="form-grid">
                <div class="form-group">
                    <label>Partidos Jugados</label>
                    <input type="number" id="partidosJugados" min="0" value="0" required>
                </div>
                <div class="form-group">
                    <label>Porcentaje de Aciertos (%)</label>
                    <input type="number" id="porcentajeAciertos" min="0" max="100" step="0.1" value="0" required>
                </div>
                <div class="form-group">
                    <label>Categoría Asignada</label>
                    <select id="categoriaBochador" required>
                        <option value="F">Categoría F (Inicial)</option>
                        <option value="E">Categoría E</option>
                        <option value="D">Categoría D</option>
                        <option value="C">Categoría C</option>
                        <option value="B">Categoría B</option>
                        <option value="A">Categoría A (Élite)</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="saveBtn" class="save-btn">
                <i class="fas fa-save"></i> Guardar Evaluación y Clasificar
            </button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const db = window.supabaseClient;
            if (!db) {
                showAlert('Error: No se pudo conectar con la base de datos.', 'error');
                return;
            }

            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const resultCard = document.getElementById('resultCard');
            const evaluationForm = document.getElementById('evaluationForm');
            const kycWarning = document.getElementById('kycWarning');
            const saveBtn = document.getElementById('saveBtn');

            let currentUserId = null;

            searchBtn.addEventListener('click', handleSearch);
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleSearch();
            });

            async function handleSearch() {
                const query = searchInput.value.trim();
                if (!query) {
                    showAlert('Por favor, ingresa un correo o ID de usuario.', 'error');
                    return;
                }

                searchBtn.disabled = true;
                searchBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Buscando...';
                resultCard.classList.remove('active');
                evaluationForm.classList.remove('active');
                kycWarning.classList.remove('active');

                try {
                    // Buscar por email o user_id (el ID tipo BC-XXXXXX)
                    const { data, error } = await db
                        .from('perfiles')
                        .select('*')
                        .or(`email.eq.${query},user_id.eq.${query}`)
                        .single();

                    if (error || !data) {
                        showAlert('Usuario no encontrado. Verifica el correo o ID.', 'error');
                        return;
                    }

                    currentUserId = data.id;
                    
                    // Llenar datos del usuario
                    document.getElementById('userName').textContent = data.nombre || 'Sin nombre';
                    document.getElementById('userEmail').textContent = data.email || 'Sin correo';
                    document.getElementById('userId').textContent = data.user_id || 'Sin ID';
                    
                    const kycBadge = document.getElementById('userKyc');
                    if (data.estado_kyc === 'verificado') {
                        kycBadge.textContent = 'Verificado';
                        kycBadge.className = 'status-badge status-verified';
                        
                        // Mostrar formulario de evaluación
                        evaluationForm.classList.add('active');
                        kycWarning.classList.remove('active');
                        
                        // Cargar valores existentes si los tiene
                        document.getElementById('partidosJugados').value = data.partidos_jugados || 0;
                        document.getElementById('porcentajeAciertos').value = data.porcentaje_aciertos || 0;
                        document.getElementById('categoriaBochador').value = data.categoria_bochador || 'F';
                    } else {
                        kycBadge.textContent = data.estado_kyc || 'Pendiente';
                        kycBadge.className = 'status-badge status-pending';
                        
                        // Mostrar advertencia y ocultar formulario
                        evaluationForm.classList.remove('active');
                        kycWarning.classList.add('active');
                    }

                    resultCard.classList.add('active');
                    showAlert('Usuario encontrado exitosamente.', 'success');

                } catch (err) {
                    console.error('Error en la búsqueda:', err);
                    showAlert('Ocurrió un error al buscar el usuario.', 'error');
                } finally {
                    searchBtn.disabled = false;
                    searchBtn.innerHTML = '<i class="fas fa-search"></i> Buscar';
                }
            }

            evaluationForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                if (!currentUserId) return;

                saveBtn.disabled = true;
                saveBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Guardando...';

                const partidos = parseInt(document.getElementById('partidosJugados').value) || 0;
                const aciertos = parseFloat(document.getElementById('porcentajeAciertos').value) || 0;
                const categoria = document.getElementById('categoriaBochador').value;

                try {
                    const { error } = await db
                        .from('perfiles')
                        .update({
                            partidos_jugados: partidos,
                            porcentaje_aciertos: aciertos,
                            categoria_bochador: categoria
                        })
                        .eq('id', currentUserId);

                    if (error) throw error;

                    showAlert(`¡Evaluación guardada! El usuario ha sido clasificado en Categoría ${categoria}.`, 'success');
                    
                    // Recargar los datos para confirmar
                    setTimeout(() => {
                        handleSearch();
                    }, 1500);

                } catch (err) {
                    console.error('Error al guardar:', err);
                    showAlert('Error al guardar la evaluación. Inténtalo de nuevo.', 'error');
                } finally {
                    saveBtn.disabled = false;
                    saveBtn.innerHTML = '<i class="fas fa-save"></i> Guardar Evaluación y Clasificar';
                }
            });

            function showAlert(message, type) {
                const alertBox = document.getElementById('alertBox');
                alertBox.className = `alert alert-${type} active`;
                const icon = type === 'success' ? 'check-circle' : 'times-circle';
                alertBox.innerHTML = `<i class="fas fa-${icon}"></i> ${message}`;
                
                setTimeout(() => {
                    alertBox.classList.remove('active');
                }, 5000);
            }
        });
    </script>
</body>
</html>
